<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haunted Manor Sounboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lightning-overlay"></div>
    <div class="app-container">

        <header class="app-header">
            <h1>Haunted Manor Soundboard</h1>
            <button id="power-btn" class="power-btn">Power Audio Engine</button>
        </header>

        <main class="dashboard-grid">

            <section class="card visualizer-card">
                <h2>Spectral Oscilloscope</h2>
                <canvas id="visualizer" width="600" height="150"></canvas>
            </section>

            <section class="card ambient-card">
                <h2>Continuous Atmosphere</h2>

                <div class="slider-group">
                    <label for="wind-vol">Haunted Wind</label>
                    <input type="range" id="wind-vol" min="0" max="1" step="0.01" value="0">
                </div>

                <div class="slider-group">
                    <label for="rain-vol">Heavy Rain</label>
                    <input type="range" id="rain-vol" min="0" max="1" step="0.01" value="0">
                </div>

                <div class="slider-group">
                    <label for="drone-vol">Crypt Drone</label>
                    <input type="range" id="drone-vol" min="0" max="1" step="0.01" value="0">
                </div>

                <div class="slider-group">
                    <label for="chime-vol">Ghostly Chimes</label>
                    <input type="range" id="chime-vol" min="0" max="1" step="0.01" value="0">
                </div>

            </section>

            <section class="card sfx-card">
                <h2>One-Shot Effects</h2>
                <div class="pad-grid">
                    <button class="sfx-pad" id="sfx-thunder">Thunder Strike <span class="hotkey">[V]</span></button>
                    <button class="sfx-pad" id="sfx-creak">Door Creak <span class="hotkey">[C]</span></button>
                    <button class="sfx-pad" id="sfx-wail">Banshee Wail <span class="hotkey">[N]</span></button>
                    <button class="sfx-pad" id="sfx-bell">Toll Bell <span class="hotkey">[B]</span></button>
                    <button id="reverb-toggle-btn" class="sfx-btn fx-toggle">
                        Reverb: <span id="reverb-status">OFF</span>
                    </button>
                </div>
            </section>

            <section class="card preset-card">
                <h2>Mix Presets</h2>
                <div class="preset-controls">
                    <input type="text" id="preset-name" placeholder="Preset Name">
                    <button id="save-preset-btn" class="btn">Save Mix</button>
                </div>
                <div id="preset-list" class="preset-list">
                 <!--dynamic presets will be put hereee-->   
                </div>
            </section>

            <section class="card recorder-card">
                <h2>Live Audio Recorder</h2>
                <div class="recorder-controls">
                    <button id="rec-btn" class="btn">Start Recording</button>
                    <button id="download-btn" class="btn" disabled>Download Mix</button>
                    <span id="rec-status">Ready</span>
                </div>
            </section>

            <section class="card organ-card wide">
                <h2>Phantom Pipe Organ & Song Practice</h2>

                <div class="song-control-bar" style="display: flex; justify-content: space-between; align-items: center; background: #120d1d; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #2a2238; flex-wrap: wrap; gap: 10px;">
                    <div>
                        <span style="color: #39ff14; font-weight: bold;">Song Sheet:</span>
                        <span style="color: #e2d9f3; font-weight: 600; font-size: 1rem;">Addams Family Theme</span>

                        <div id="song-sheet-display" style="display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap;">
                            <span class="sheet-note" data-freq="261.63">C4 (A)</span>
                            <span class="sheet-note" data-freq="349.23">F4 (F)</span>
                            <span class="sheet-note" data-freq="392.00">G4 (G)</span>
                            <span class="sheet-note" data-freq="440.00">A4 (H)</span>
                            <span class="sheet-note" data-freq="349.23">F4 (F)</span>
                            <span class="sheet-note" data-freq="392.00">G4 (G)</span>
                            <span class="sheet-note" data-freq="440.00">A4 (H)</span>
                        </div>
                        <div id="practice-status style=color: #8a859b; font-size: 0.85rem; margin-top: 6px;">
                            Press notes on your keyboard to play along!
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button id="toggle-practice-btn" class="btn" style="background: #2a2238; border: 1px solid #3d3254;">Mode: Free Play</button>
                        <button id="play-demo-btn" class="btn">▶ Play Demo</button>
                    </div>
                </div>

                <div class="organ-keyboard">
                    <button class="organ-key" data-note="261.63"><span class="key-label">A</span><span class="note-label">C4</span></button>
                    <button class="organ-key black-key" data-note="277.18"><span class="key-label">W</span><span class="note-label">C#4</span></button>
                    <button class="organ-key" data-note="293.66"><span class="key-label">S</span><span class="note-label">D4</span></button>
                    <button class="organ-key black-key" data-note="311.13"><span class="key-label">E</span><span class="note-label">D#4</span></button>
                    <button class="organ-key" data-note="329.63"><span class="key-label">D</span><span class="note-label">E4</span></button>
                    <button class="organ-key" data-note="349.23"><span class="key-label">F</span><span class="note-label">F4</span></button>
                    <button class="organ-key black-key" data-note="369.99"><span class="key-label">T</span><span class="note-label">F#4</span></button>
                    <button class="organ-key" data-note="392.00"><span class="key-label">G</span><span class="note-label">G4</span></button>
                    <button class="organ-key black-key" data-note="415.30"><span class="key-label">Y</span><span class="note-label">G#4</span></button>
                    <button class="organ-key" data-note="440.00"><span class="key-label">H</span><span class="note-label">A4</span></button>
                    <button class="organ-key black-key" data-note="466.16"><span class="key-label">U</span><span class="note-label">A#4</span></button>
                    <button class="organ-key" data-note="493.88"><span class="key-label">J</span><span class="note-label">B4</span></button>
                    <button class="organ-key" data-note="523.25"><span class="key-label">K</span><span class="note-label">C5</span></button>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
